name: Test Pharos

on:
  push:

concurrency:
  group: test-pharos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pharos:
    name: Run Pharos security scan
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@446d11f033ffe30b4c91f885c3ad34ea3d8c6af7 # v0.7.0
        with:
          allow_severity_level: critical
          image_url: ghcr.io/kartverket/smia-ogc-api:latest
          trivy_vex: "false"
