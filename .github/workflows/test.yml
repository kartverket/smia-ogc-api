name: Test
on: [pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run pytest -m "not integration" --cov=processes --cov=deploy --cov-report=
      - name: Run integration tests
        run: uv run pytest --cov=processes --cov=deploy --cov-report=term-missing
