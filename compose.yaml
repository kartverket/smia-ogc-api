services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: inndelinger
      POSTGRES_USER: inndelinger
      POSTGRES_PASSWORD: inndelinger
    ports:
      - "5432:5432"
    volumes:
      - ./dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inndelinger -d inndelinger"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      INNDELINGER_DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: inndelinger
      INNDELINGER_DB_USER: inndelinger
      INNDELINGER_DB_PASSWORD: inndelinger
      DB_SCHEMA: inndelinger
      PYGEOAPI_URL: http://localhost:5000
      OGC_API_KEY: testkey
      MATRIKKELEN_USERNAME: ${MATRIKKELEN_USERNAME:-}
      MATRIKKELEN_PASSWORD: ${MATRIKKELEN_PASSWORD:-}
      MATRIKKELEN_WELLKNOWN_URL: ${MATRIKKELEN_WELLKNOWN_URL:-}
      MATRIKKEL_WSDL_URL: ${MATRIKKEL_WSDL_URL:-}
    ports:
      - "5000:5000"
      - "8181:8181"
    develop:
      watch:
        - action: rebuild
          path: ./processes
        - action: rebuild
          path: ./pygeoapi-config.yml
        - action: rebuild
          path: ./deploy
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
